# ══════════════════════════════════════════════════════════════════════════════
# Perfil de PRODUÇÃO — FieldOps API
# Ativar com: SPRING_PROFILES_ACTIVE=prod
# ══════════════════════════════════════════════════════════════════════════════

# ── Logging (issue #78): nível INFO em produção
# O formato JSON é controlado pelo logback-spring.xml (springProfile name="prod")
logging.level.root=INFO
logging.level.AUDIT=INFO
logging.level.com.experiencefieldops=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ── H2 Console: desabilitado em produção (acesso indevido ao banco)
spring.h2.console.enabled=false

# ── SQL: nunca exibir queries em produção
spring.jpa.show-sql=false
