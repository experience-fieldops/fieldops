spring.application.name=api
server.port=8080

# ── Segurança: suprime o header "Server" nas respostas HTTP (issue #76)
# Evita expor a versão do servidor para atacantes.
server.server-header=

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:fieldopsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 console (acessivel em /h2-console — desabilitar em produção)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Upload de arquivos (issue #79)
# Limite por arquivo: 10 MB | Limite por requisição: 10 MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Diretório de armazenamento dos uploads.
# IMPORTANTE: deve apontar para um caminho FORA do diretório público web (issue #79).
# Em produção, substitua por um caminho absoluto fora do contexto da aplicação,
# ex: /var/fieldops/uploads
# O valor padrão abaixo usa o diretório temporário do SO (adequado para dev).
upload.directory=${java.io.tmpdir}/fieldops-uploads
