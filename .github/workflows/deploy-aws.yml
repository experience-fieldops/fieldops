name: Deploy API → AWS Elastic Beanstalk

on:
  push:
    branches: [ develop ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-aws.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (sem testes)
        run: mvn package -DskipTests -q
        working-directory: api

      - name: Criar pacote de deploy
        run: |
          mkdir -p deploy
          cp api/Dockerfile deploy/
          cp api/target/*.jar deploy/app.jar
          cd deploy && zip -r ../fieldops-api.zip .

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload do pacote para S3
        run: |
          VERSION="fieldops-api-${{ github.sha }}.zip"
          aws s3 cp fieldops-api.zip s3://${{ secrets.EB_BUCKET }}/$VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Criar nova versão no Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket="${{ secrets.EB_BUCKET }}",S3Key="${{ env.VERSION }}"

      - name: Deploy no ambiente Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.EB_ENV_NAME }}" \
            --version-label "${{ github.sha }}"

      - name: Aguardar ambiente ficar pronto
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ secrets.EB_ENV_NAME }}"
          echo "✅ Deploy concluído!"
